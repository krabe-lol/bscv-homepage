# Deployt das Backend (cms.bscv.de) per SFTP nach Hetzner, sobald auf main etwas in backend/ oder an den
# Build-/Deploy-Skripten geändert wird. Die .env, public/uploads, .strapi-updater.json und logs auf dem Server
# bleiben unberührt.
# Benötigtes Secret (Repository → Einstellungen → Actions → Secrets): DEPLOY_SSH_KEY = Inhalt der privaten
# Schlüsseldatei (bscv_deploy, ed25519, ohne Passphrase), inkl. BEGIN/END-Zeilen.
# Der Runner braucht Docker, weil der Job in einem Container (node:22-bullseye) läuft.
name: Backend deployen

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "scripts/output.mjs"
      - "scripts/deploy.mjs"
  workflow_dispatch:

# Zwei Deploys desselben Teils dürfen sich nicht überlappen
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Gleiches Node und glibc wie beim Build für den Hoster
    container: node:22-bullseye
    steps:
      - uses: actions/checkout@v4

      - name: lftp installieren
        run: apt-get update && apt-get install -y lftp openssh-client

      # Die package-lock.json-Dateien stammen von npm 11; das npm 10 aus dem Image hält sie für veraltet und bricht ab
      - name: npm wie lokal
        run: npm install -g npm@11.11.1

      # Vollständig (mit devDependencies), weil strapi build sie braucht
      - name: Abhängigkeiten installieren
        run: npm ci
        working-directory: backend

      - name: Backend bauen
        run: node scripts/output.mjs --nur-cms

      - name: Per SFTP hochladen
        run: node scripts/deploy.mjs cms
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Hinweis zum Neustart
        run: echo "Backend hochgeladen. Jetzt in konsoleH die Node.js-App für cms.bscv.de neu starten."
