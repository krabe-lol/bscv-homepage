# Deployt das Backend (cms.bscv.de) per SFTP nach Hetzner, sobald auf main etwas in backend/ oder an den
# Build-/Deploy-Skripten geändert wird. Die .env, public/uploads, .strapi-updater.json und logs auf dem Server
# bleiben unberührt.
# Auf dev (und beim Start von Hand mit Haken bei „Trockenlauf“) wird nur gebaut und angezeigt, was sich auf dem
# Server ändern würde; hochgeladen wird dann nichts.
# Benötigte Secrets (Repository → Einstellungen → Actions → Secrets): DEPLOY_HOST, DEPLOY_USER (SFTP-Zugang) und DEPLOY_SSH_KEY_B64 = private
# Schlüsseldatei (bscv_deploy, ed25519, ohne Passphrase) Base64-kodiert in einer Zeile. Nicht als Klartext ablegen:
# Mehrzeilige Secrets maskiert Gitea in der env-Anzeige der Logs nicht.
# Der Runner braucht Docker, weil der Job in einem Container (node:22-bullseye) läuft.
name: Backend deployen

on:
  push:
    branches: [main, dev]
    paths:
      - "backend/**"
      - "scripts/output.mjs"
      - "scripts/deploy.mjs"
      - ".gitea/workflows/deploy-backend.yml"
  workflow_dispatch:
    inputs:
      trockenlauf:
        description: "Trockenlauf: nur bauen und anzeigen, was sich auf dem Server ändern würde"
        type: boolean
        default: true
      node_modules_erzwingen:
        description: "node_modules immer neu installieren und hochladen (auch wenn die package-lock.json gleich ist)"
        type: boolean
        default: false

# Zwei Deploys desselben Teils dürfen sich nicht überlappen; je Branch getrennt, damit ein Trockenlauf auf dev
# keinen wartenden Deploy von main verdrängt
concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Gleiches Node und glibc wie beim Build für den Hoster
    container: node:22-bullseye
    env:
      # "true" auf allen Branches außer main (dort wird also nie echt hochgeladen) und beim Start von Hand mit Haken
      TROCKENLAUF: ${{ github.ref != 'refs/heads/main' || inputs.trockenlauf }}
    steps:
      # Gitea meldet sich bei den Jobs als http://server:3000, diesen Namen kennen die Job-Container aber nicht.
      # Daher über die normale Adresse holen (brettchen und portfolio klonen ebenfalls von git.krabe.lol).
      - uses: actions/checkout@v4
        with:
          github-server-url: https://git.krabe.lol

      - name: lftp installieren
        run: apt-get update && apt-get install -y lftp openssh-client

      # Die package-lock.json-Dateien stammen von npm 11; das npm 10 aus dem Image hält sie für veraltet und bricht ab
      - name: npm wie lokal
        run: npm install -g npm@11.11.1

      # Vollständig (mit devDependencies), weil strapi build sie braucht
      - name: Abhängigkeiten installieren
        run: npm ci
        working-directory: backend

      # node_modules ändern sich nur mit der package-lock.json. Ist die auf dem Server gleich der im Repo, entfallen
      # das zweite npm ci und das Hochladen von node_modules (spart rund 2 Minuten). Klappt der Vergleich nicht,
      # wird wie bisher alles hochgeladen.
      - name: package-lock.json mit dem Server vergleichen
        # format(): Häkchen kann als Boolean oder als Text "true" ankommen; bei push gibt es keine inputs
        if: format('{0}', inputs.node_modules_erzwingen) != 'true'
        run: |
          if node scripts/deploy.mjs cms --lock-vergleichen; then
            echo "OHNE_NODE_MODULES=--ohne-node-modules" >> "$GITHUB_ENV"
          else
            echo "node_modules werden neu installiert und hochgeladen."
          fi
        env:
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}

      - name: Backend bauen
        run: node scripts/output.mjs --nur-cms $OHNE_NODE_MODULES

      - name: Per SFTP hochladen
        run: |
          if [ "$TROCKENLAUF" = "true" ]; then
            node scripts/deploy.mjs cms --dry-run $OHNE_NODE_MODULES
          else
            node scripts/deploy.mjs cms $OHNE_NODE_MODULES
          fi
        env:
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}

      - name: Hinweis zum Neustart
        if: env.TROCKENLAUF != 'true'
        run: echo "Backend hochgeladen. Jetzt in konsoleH die Node.js-App für cms.bscv.de neu starten."
